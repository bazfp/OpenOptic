name: Release

# Publish a release with the six binaries in either of two ways:
#  - push a tag such as v1.0.0, or
#  - Actions -> Release -> Run workflow, entering the version (the tag is created for you).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Version must look like v1.2.3"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: make test
      - name: Build
        run: make dist VERSION="$VERSION"
      - name: Checksums
        run: cd dist && sha256sum openoptic-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "OpenOptic $VERSION" --generate-notes --target "$GITHUB_SHA"
